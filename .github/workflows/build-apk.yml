name: Build Android APK (com.gossaigaon.bazar)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build signed Release APK (requires keystore secrets)"
        required: false
        default: false
        type: boolean

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21 (Required for Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Vite Web App
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Initialize or Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/prepare-android.mjs

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gossaigaon-bazar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build & Sign Release APK (if Keystore Secrets exist)
        id: release_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FORCE_RELEASE: ${{ inputs.build_release }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_BASE64 secret not set, skipping release APK."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$FORCE_RELEASE" != "true" ]; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..

          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="bazar-aligned.apk"
          SIGNED_APK="gossaigaon-bazar-release-signed.apk"

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          rm -f release.jks "$ALIGNED_APK"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload Signed Release APK Artifact
        if: steps.release_apk.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gossaigaon-bazar-release-signed-apk
          path: gossaigaon-bazar-release-signed.apk
          retention-days: 14
