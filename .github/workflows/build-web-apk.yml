name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build Vite app
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor-firebase/authentication
          npm run build

      - name: Setup Capacitor Android & Google Sign-In
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          cp public/assets/aistudio/google-services_5c61c5de.json android/app/google-services.json
          if ! grep -q "rgcfaIncludeGoogle" android/variables.gradle; then
            printf '\next {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = "1.3.0"\n}\n' >> android/variables.gradle
          fi
          cat android/variables.gradle
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Print Actual APK SHA-1 (Copy this to Firebase Console)
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chutki-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
